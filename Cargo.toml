[package]
name = "wild-ide"
version = "0.1.0"
edition = "2021"
authors = ["Wild IDE contributors"]
description = "Wild IDE (野IDE) - a tiny Arduino/ESP32 IDE"
license = "MIT"
readme = "README.md"

[dependencies]
eframe = "0.29"
egui = "0.29"
serialport = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
ureq = "2.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
